<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Сечения многогранников</title>
<style>
/* === 1. БАЗОВЫЕ ПЕРЕМЕННЫЕ И ТЕМА === */
:root{--ac:#3d6df2;--bg:#f2f5fa;--card:#fff;--tx:#12203a;--mut:#62728a;--ln:#a7b6cb;--ok:#0f9d73;--bad:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a111f;--card:#131c2e;--tx:#e8eefc;--mut:#8d9ebb;--ln:#46577a}}
:root[data-theme="dark"]{--bg:#0a111f;--card:#131c2e;--tx:#e8eefc;--mut:#8d9ebb;--ln:#46577a}
html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 10% -5%,color-mix(in srgb,var(--ac) 22%,transparent),transparent 55%),var(--bg);display:flex;justify-content:center}
#app{width:100%;max-width:920px;padding:18px;display:none; /* Скрыто до конца загрузки */}

/* === 2. ЭКРАН ЗАГРУЗКИ (Loader) === */
#loader-wrap {position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;justify-content:center;align-items:center;transition:opacity 0.5s ease;}
.loader {width: 120px;height: 120px;position: relative;transform: rotate(-45deg);}
.loader .box {position: absolute;width: 30%;height: 30%;background-color: var(--ac);border-radius: 4px;animation: loader-anim 2s infinite ease-in-out;}
.loader .box0 {top: 0; left: 0; animation-delay: 0s;} .loader .box1 {top: 0; left: 35%; animation-delay: 0.1s;} .loader .box2 {top: 0; left: 70%; animation-delay: 0.2s;}
.loader .box3 {top: 35%; left: 0; animation-delay: 0.1s;} .loader .box4 {top: 35%; left: 35%; animation-delay: 0.2s;} .loader .box5 {top: 35%; left: 70%; animation-delay: 0.3s;}
.loader .box6 {top: 70%; left: 0; animation-delay: 0.2s;} .loader .box7 {top: 70%; left: 35%; animation-delay: 0.3s;} .loader .ground {top: 70%; left: 70%; background:var(--ok); animation-delay: 0.4s;}
@keyframes loader-anim {0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.5); opacity: 0.5; }}

/* === 3. ИНТЕРФЕЙС И КНОПКИ === */
header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
header h1{flex:1;margin:0;font-size:19px;font-weight:700;letter-spacing:.2px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer;padding:0;transition:transform .15s,border-color .2s}.ib:hover{border-color:var(--ac)}.ib:active{transform:scale(.92)}
.dot{display:block;width:18px;height:18px;border-radius:50%;background:var(--ac);margin:auto;transition:background .3s}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 8px 28px #0002;border:1px solid color-mix(in srgb,var(--ln) 40%,transparent);margin-bottom:12px;}
.a{animation:up .4s both}@keyframes up{from{opacity:0;transform:translateY(14px)}}
h2{margin:0 0 8px;font-size:19px}p{margin:6px 0;color:var(--mut)}
.btn{font:inherit;font-weight:600;border:0;border-radius:14px;padding:14px 20px;background:var(--ac);color:#fff;cursor:pointer;margin-top:10px;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 40%,transparent);transition:transform .12s,box-shadow .2s; width: 100%; max-width: 300px; display: inline-block; text-align: center;}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.96)}.btn.alt{background:transparent;color:var(--ac);box-shadow:none;border:1.5px solid var(--ac)}
.btn-group {display: flex; gap: 8px; flex-wrap: wrap;}

/* === 4. ПЛИТКИ МЕНЮ (АДАПТИВНЫЕ) === */
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));gap:14px}
.mode-card{position:relative;height:245px;perspective:900px;cursor:pointer;animation:up .5s both}
.mode-card .mc-inner{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.mode-card:hover .mc-inner{transform:rotateY(180deg)}
.mode-card:active .mc-inner{transform:scale(.97)}
.mode-card .mc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:18px;border:1px solid color-mix(in srgb,var(--ln) 45%,transparent);box-shadow:0 12px 30px #0002}
.mode-card .mc-front{background:linear-gradient(145deg,var(--mc),color-mix(in srgb,var(--mc) 65%,#000));color:#fff}
.mode-card .mc-back{background:var(--card);color:var(--tx);transform:rotateY(180deg);align-items:flex-start;justify-content:flex-start}
.mode-card .mc-num{font-size:14px;font-weight:800;letter-spacing:2px;opacity:.8}
.mode-card .mc-icon{font-size:48px;line-height:1;margin:18px 0 12px;filter:drop-shadow(0 5px 8px #0003)}
.mode-card .mc-title{font-size:23px;font-weight:800;text-align:center}
.mode-card .mc-hint{font-size:12px;opacity:.85;margin-top:8px;text-align:center}
.mode-card .mc-back h3{margin:0 0 8px;font-size:19px}
.mode-card .mc-back p{margin:0;color:var(--mut);font-size:14px}
.mode-card .mc-back .mc-stat{margin-top:auto;width:100%;padding-top:12px;border-top:1px solid var(--ln);font-weight:700;color:var(--ac)}

/* === 5. ИГРОВЫЕ ЭЛЕМЕНТЫ === */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(max-width: 500px) { .opts {grid-template-columns: 1fr;} }
.opts button{font:inherit;font-weight:600;padding:14px 8px;border-radius:14px;border:2px solid var(--ln);background:var(--bg);color:var(--tx);cursor:pointer;transition:transform .12s,border-color .2s; font-size: 15px;}
.opts button:hover{border-color:var(--ac)}.opts button:active{transform:scale(.96)}
.opts button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 25%,transparent);animation:pl .5s}.opts button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,transparent);animation:sk .4s}
@keyframes pl{40%{transform:scale(1.08)}}
.msg{color:var(--bad);font-weight:600; padding: 10px; background: color-mix(in srgb, var(--bad) 10%, transparent); border-radius: 10px;}
.good{color:var(--ok);font-weight:600; padding: 10px; background: color-mix(in srgb, var(--ok) 10%, transparent); border-radius: 10px;}
.shake{animation:sk .4s}@keyframes sk{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.bar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--ln) 40%,transparent);overflow:hidden;margin:6px 4px}.bar i{display:block;height:100%;background:var(--ac);transition:width .5s}

/* === 6. ТЕОРИЯ И ИЛЛЮСТРАЦИИ === */
.theory-tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px; margin-bottom: 12px;}
.theory-tabs button{white-space:nowrap; padding: 10px 16px; margin: 0; width: auto;}
.theory-section{animation:up .35s both}
.theory-example{border-left:4px solid var(--ac);padding:12px 14px;background:color-mix(in srgb,var(--ac) 8%,var(--card));border-radius:0 14px 14px 0;margin:12px 0}
.ill-box {display:flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;}
.ill-card {flex: 1; min-width: 140px; border: 2px solid var(--ln); border-radius: 12px; padding: 10px; text-align: center; background: var(--bg);}
.ill-card svg {width: 100%; max-height: 120px; margin-bottom: 8px;}
.ill-card.wrong {border-color: var(--bad); background: color-mix(in srgb, var(--bad) 5%, var(--bg));}
.ill-card.right {border-color: var(--ok); background: color-mix(in srgb, var(--ok) 5%, var(--bg));}

/* === 7. СВОБОДНАЯ 3D И КАНВАС === */
.free-wrap{display:flex;flex-direction:column;gap:10px}
.free-toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.free-toolbar .group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.free-toolbar button,.free-shape{font:inherit;font-weight:700;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:11px;padding:9px 11px;cursor:pointer}
.free-toolbar button.active,.free-shape.active{background:var(--ac);color:#fff;border-color:var(--ac)}
.free-canvas-wrap{position:relative;overflow:hidden;border-radius:22px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--ac) 10%,transparent),transparent 60%),var(--bg);border:1px solid var(--ln);box-shadow:inset 0 0 35px #0001}
.free-canvas-wrap canvas{display:block;width:100%;height:620px;touch-action:none;cursor:grab}
@media(max-width:700px){.free-canvas-wrap canvas{height:400px}}
svg{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#sw{touch-action:none}#sw svg{overflow:visible}#sw circle[data-point]{-webkit-tap-highlight-color:transparent}
.settings-box .seg button{font:inherit;border:1px solid var(--ln);background:var(--bg);color:var(--tx);padding:9px 12px;border-radius:11px;cursor:pointer}.settings-box .seg button.active{background:var(--ac);color:#fff;border-color:var(--ac)}
</style>
</head>
<body>

<!-- Экран загрузки -->
<div id="loader-wrap">
  <div class="loader">
    <div class="box box0"></div><div class="box box1"></div><div class="box box2"></div>
    <div class="box box3"></div><div class="box box4"></div><div class="box box5"></div>
    <div class="box box6"></div><div class="box box7"></div><div class="ground"></div>
  </div>
</div>

<canvas id="cf" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9"></canvas>
<div id="app">
  <header>
    <button class="ib" id="bk" onclick="menu()">←</button>
    <h1>Сечения многогранников</h1>
    <button class="ib" onclick="acc()" title="Цвет"><i class="dot"></i></button>
    <button class="ib" onclick="soundOn=!soundOn;this.textContent=soundOn?'🔊':'🔇';clickSound()" title="Звук">🔊</button>
    <button class="ib" onclick="settings()" title="Настройки">⚙</button>
    <button class="ib" onclick="theme()" title="Тема">◐</button>
  </header>
  <main id="mn"></main>
</div>

<script>
// === 1. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И ДАННЫЕ ===
const bx=(v,k)=>Object.fromEntries(Object.entries(v).map(([a,p])=>[a,p.map((x,i)=>x*k[i])]));
const CUBE={A:[0,0,0],B:[1,0,0],C:[1,1,0],D:[0,1,0],A1:[0,0,1],B1:[1,0,1],C1:[1,1,1],D1:[0,1,1]},CE='A-B B-C C-D D-A A1-B1 B1-C1 C1-D1 D1-A1 A-A1 B-B1 C-C1 D-D1',CF='A,B,C,D A1,B1,C1,D1 A,B,B1,A1 B,C,C1,B1 C,D,D1,C1 D,A,A1,D1';
const SOL={
cube:{n:'Куб',v:CUBE,e:CE,h:'A-B D-A A-A1',f:CF},
box:{n:'Параллелепипед',v:bx(CUBE,[1.2,.9,.7]),e:CE,h:'A-B D-A A-A1',f:CF},
pyr:{n:'Пирамида',v:{A:[0,0,0],B:[1,0,0],C:[1,1,0],D:[0,1,0],S:[.5,.5,1.2]},e:'A-B B-C C-D D-A A-S B-S C-S D-S',h:'A-B D-A A-S',f:'A,B,C,D A,B,S B,C,S C,D,S D,A,S'},
pri:{n:'Призма',v:{A:[0,0,0],B:[1,0,0],C:[.5,1,0],A1:[0,0,1],B1:[1,0,1],C1:[.5,1,1]},e:'A-B B-C C-A A1-B1 B1-C1 C1-A1 A-A1 B-B1 C-C1',h:'A-B C-A A-A1',f:'A,B,C A1,B1,C1 A,B,B1,A1 B,C,C1,B1 C,A,A1,C1'},
tet:{n:'Тетраэдр',v:{A:[0,0,0],B:[1,0,0],C:[.5,1,0],S:[.7,.4,1.1]},e:'A-B B-C C-A A-S B-S C-S',h:'A-B C-A A-S',f:'A,B,C A,B,S B,C,S C,A,S'},
oct:{n:'Октаэдр',v:{T:[.5,.5,1.25],A:[0,0,.55],B:[1,0,.55],C:[1,1,.55],D:[0,1,.55],U:[.5,.5,-.15]},e:'T-A T-B T-C T-D A-B B-C C-D D-A U-A U-B U-C U-D',h:'T-A T-D U-A U-D',f:'T,A,B T,B,C T,C,D T,D,A U,A,B U,B,C U,C,D U,D,A'},
pri5:{n:'Пятиугольная призма',v:{A:[0,0,0],B:[.95,0,0],C:[1.18,.75,0],D:[.55,1.25,0],E:[-.15,.7,0],A1:[0,0,1],B1:[.95,0,1],C1:[1.18,.75,1],D1:[.55,1.25,1],E1:[-.15,.7,1]},e:'A-B B-C C-D D-E E-A A1-B1 B1-C1 C1-D1 D1-E1 E1-A1 A-A1 B-B1 C-C1 D-D1 E-E1',h:'A-B E-A A-A1',f:'A,B,C,D,E A1,B1,C1,D1,E1 A,B,B1,A1 B,C,C1,B1 C,D,D1,C1 D,E,E1,D1 E,A,A1,E1'}
};

const PA=[['A','A1',.6],['B','B1',.9],['C','C1',.5],['D','D1',.2]],SQ=[['A','B',.5],['D','C',.5],['D1','C1',.5],['A1','B1',.5]],PE=[['A','A1',.2],['B','B1',.8],['B1','C1',.4],['C1','D1',.5],['D','D1',.7]],HX=[['A1','B1',.5],['B1','B',.5],['B','C',.5],['C','D',.5],['D','D1',.5],['D1','A1',.5]];
const LV=[
{s:'cube',n:'Параллелограмм',d:2,p:PA,t:'Плоскость пересекает параллельные грани по параллельным прямым.'},
{s:'cube',n:'Квадрат',d:1,p:SQ,t:'Плоскость параллельна грани, поэтому сечение равно этой грани.'},
{s:'cube',n:'Треугольник',d:1,p:[['B','A',.4],['B','B1',.5],['B','C',.3]],t:'Срезали угол куба: пересечены три грани.'},
{s:'cube',n:'Шестиугольник',d:3,p:HX,t:'Плоскость через середины шести рёбер даёт шестиугольник.'},
{s:'pyr',n:'Трапеция',d:2,p:[['A','S',.4],['B','S',.4],['C','S',.6],['D','S',.6]],t:'Две стороны лежат на параллельных прямых.'},
{s:'pri',n:'Треугольник',d:1,p:[['A','A1',.5],['B','B1',.5],['C','C1',.5]],t:'Сечение параллельно основанию.'}
];
const NAMES=['Треугольник','Квадрат','Прямоугольник','Параллелограмм','Трапеция','Пятиугольник','Шестиугольник'];

// НОВЫЙ БАЗОВЫЙ НАБОР ВОПРОСОВ ДЛЯ ЗАДАЧ
const TASKS_BANK = [
  {q: "Какое максимальное число сторон может быть у сечения куба?", o: ["4", "5", "6", "8"], a: 2},
  {q: "Если плоскость пересекает две параллельные грани многогранника, то линии пересечения...", o: ["Всегда параллельны", "Могут пересекаться", "Всегда перпендикулярны", "Зависит от фигуры"], a: 0},
  {q: "Может ли в сечении тетраэдра (треугольной пирамиды) получиться квадрат?", o: ["Да", "Нет", "Только у правильного", "Только прямоугольник"], a: 0},
  {q: "Сколько точек нужно минимум, чтобы задать плоскость сечения?", o: ["2", "3", "4", "Зависит от фигуры"], a: 1},
  {q: "Если мы срезаем только один угол куба (пересекаем 3 ребра из одной вершины), какая фигура в сечении?", o: ["Квадрат", "Треугольник", "Трапеция", "Прямоугольник"], a: 1},
  {q: "Стороны сечения всегда лежат...", o: ["На диагоналях фигуры", "Внутри фигуры", "На гранях многогранника", "На любых прямых"], a: 2},
  {q: "Какая фигура получится, если разрезать цилиндр плоскостью, параллельной основанию?", o: ["Овал", "Круг", "Прямоугольник", "Эллипс"], a: 1}
];

const $=i=>document.getElementById(i),rnd=a=>a[Math.floor(Math.random()*a.length)],shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]),sub=n=>n.replace('1','₁');
const co=(so,s)=>{const v=SOL[so].v;if(typeof s=='string')return v[s];const[a,b,t]=s;return v[a].map((x,i)=>x+t*(v[b][i]-x))};
const pr=p=>[200+(p[0]-p[1])*108,188+(p[0]+p[1])*62-p[2]*125];
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
const sv=s=>typeof s=='string'?[s]:[s[0],s[1]],fs=(so,s)=>SOL[so].f.split(' ').filter(f=>sv(s).every(v=>f.split(',').includes(v))),share=(so,a,b)=>{const x=fs(so,b);return fs(so,a).some(f=>x.includes(f))};

let G={},best={},tmr=0,dr=null,ACC=['#3d6df2','#7c4ddb','#0f9d73','#d9811a'],ai=0;
let settingsState={inputMode:'click'}; // По умолчанию для телефонов удобнее клики
let F={shape:'cube',rx:-.42,ry:.55,zoom:1,drag:null,cut:null,pts:[],show:false,labels:[],plane:null,mode:'rotate',hover:null,zoomLocked:false,snapA:null,snapB:null};

try{best=JSON.parse(localStorage.getItem('sg')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('sg',JSON.stringify(best))}catch(e){}};

// === 2. ЗВУК И ЭФФЕКТЫ ===
let audioCtx=null,soundOn=true;
function tone(freq,dur,type='sine',gain=.055){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function goodSound(){tone(660,.09,'sine',.05);setTimeout(()=>tone(880,.13,'sine',.055),65)}
function badSound(){tone(180,.12,'sawtooth',.04);setTimeout(()=>tone(120,.16,'sawtooth',.035),90)}
function clickSound(){tone(420,.045,'triangle',.025)}
function sparkle(){
  for(let i=0;i<18;i++){
    const s=document.createElement('i');s.className='spark';
    s.style.left=(innerWidth/2+(Math.random()-.5)*90)+'px';
    s.style.top=(innerHeight*.48+(Math.random()-.5)*50)+'px';
    s.style.setProperty('--dx',((Math.random()-.5)*260)+'px');
    s.style.setProperty('--dy',((Math.random()-.5)*220)+'px');
    s.style.background='var(--ac)';document.body.appendChild(s);
    setTimeout(()=>s.remove(),800);
  }
}
function theme(){const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark'?'light':'dark'}
function acc(){ai=(ai+1)%4;document.documentElement.style.setProperty('--ac',ACC[ai])}
function conf(){const cv=$('cf'),x=cv.getContext('2d'),W=cv.width=innerWidth,H=cv.height=innerHeight,cs=[getComputedStyle(document.documentElement).getPropertyValue('--ac').trim(),'#0f9d73','#f5b301','#e5484d','#7c4ddb'];
 const P=Array.from({length:120},()=>({x:W/2,y:H*.55,vx:(Math.random()-.5)*18,vy:-Math.random()*17-4,s:6+Math.random()*7,c:rnd(cs),r:Math.random()*6,vr:(Math.random()-.5)*.4}));let f=0;
 (function a(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-f/120);x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});if(++f<120)requestAnimationFrame(a);else x.clearRect(0,0,W,H)})()}

// === 3. ЛОГИКА ИГРЫ И УПРАВЛЕНИЕ ===
function menu(){clearInterval(tmr);G={v:'menu',an:1};R()}
function mk(L,dec,sp){const so=L.s,c=(sp||L.p).map((s,i)=>({s,pos:co(so,s),i}));
 if(dec){const es=SOL[so].e.split(' ');let n=L.d==1?2:L.d==2?4:6,k=0;
  while(n>0&&k++<99){const[a,b]=rnd(es).split('-'),s=[a,b,rnd([.25,.5,.75])],pos=co(so,s);if(c.every(q=>dist(q.pos,pos)>.14)){c.push({s,pos,i:-1});n--}}
  if(L.p.some(q=>typeof q=='string')){const vk=rnd(Object.keys(SOL[so].v).filter(x=>!L.p.includes(x)));c.push({s:vk,pos:SOL[so].v[vk],i:-1})}}
 const lt=shuf('MNKPQRTUWXYZ'.split(''));c.forEach(q=>q.l=typeof q.s=='string'?q.s:lt.pop());return c}
function mkErr(L){const so=L.s,n=L.p.length,es=SOL[so].e.split(' ');let sp,bad,k,t=0;
 do{k=Math.floor(Math.random()*n);const[a,b]=rnd(es).split('-');sp=L.p.slice();sp[k]=[a,b,rnd([.25,.5,.75])];
  bad=[...Array(n).keys()].filter(i=>!share(so,sp[i],sp[(i+1)%n]))}
 while(t++<300&&(!bad.length||dist(co(so,sp[k]),co(so,L.p[k]))<.2||sp.some((s,i)=>i!=k&&dist(co(so,s),co(so,sp[k]))<.12)));
 return{L,c:mk(L,0,sp),sides:[...Array(n).keys()].map(i=>[i,(i+1)%n]),bad,stage:'e',msg:'',st:3}}

function start(m,d){G={v:'play',m,score:0,lives:3,idx:0,d,auto:m=='learn',hints:3,clickPoint:null};
 G.list=m=='learn'?[2,4,0].map(i=>LV[i]):m=='con'?shuf(LV.filter(l=>l.d==d)):shuf(LV);load()}
function load(){const L=G.list[G.idx];G.an=1;G.lv=G.m=='err'?mkErr(L):{L,c:mk(L,1),sides:[],st:3,stage:'b',hint:null,msg:'',ans:null,wr:[],opts:null,nw:-1};R()}
function mist(){G.sk=1;if(G.m=='mar'||G.m=='err'){G.lives--;if(G.lives<=0){fin();return 1}}else G.lv.st=Math.max(0,G.lv.st-1)}
const sp=e=>{const s=document.querySelector('#sw svg'),p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(s.getScreenCTM().inverse())};

// ПОЧИНЕННАЯ ФУНКЦИЯ КЛИКОВ (CLICK MODE)
function pd(e,i){
  if(G.v!='play'||G.lv.stage!='b')return;
  if(e.cancelable) e.preventDefault(); // Предотвращаем конфликты скролла на тачпадах
  
  if(settingsState.inputMode==='click'){
    if(G.clickPoint===undefined||G.clickPoint===null){
      G.clickPoint=i; 
      G.lv.msg='Точка выбрана. Нажми на вторую точку.'; 
      clickSound(); 
      R();
    } else if(G.clickPoint!==i){
      const a=G.clickPoint; 
      G.clickPoint=null; // Сброс перед проверкой, чтобы не зависало
      side(a,i);
    }
    return;
  }
  
  // Drag Mode
  dr=i;
  try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}
  const s=document.querySelector('#sw svg'),q=pr(G.lv.c[i].pos),l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.id='drg';l.setAttribute('x1',q[0]);l.setAttribute('y1',q[1]);l.setAttribute('x2',q[0]);l.setAttribute('y2',q[1]);
  l.setAttribute('stroke-width',6);l.setAttribute('stroke-dasharray','1 9');l.setAttribute('stroke-linecap','round');
  l.style.stroke='var(--ac)';l.style.pointerEvents='none';s.appendChild(l);
}

addEventListener('pointermove',e=>{
 if(dr===null||settingsState.inputMode==='click')return;
 const q=sp(e),l=$('drg');if(l){l.setAttribute('x2',q.x);l.setAttribute('y2',q.y)}
});
function targetPoint(e){
 const els=document.elementsFromPoint(e.clientX,e.clientY);
 for(const el of els){if(el&&el.dataset&&el.dataset.point!==undefined)return Number(el.dataset.point)}
 const q=sp(e);let b=-1,bd=52;
 G.lv.c.forEach((c,j)=>{const p=pr(c.pos),d=Math.hypot(p[0]-q.x,p[1]-q.y);if(d<bd){bd=d;b=j}});
 return b;
}
addEventListener('pointerup',e=>{
 if(dr===null||settingsState.inputMode==='click')return;
 const i=dr;dr=null;$('drg')?.remove();
 const b=targetPoint(e);if(b>=0&&b!==i)side(i,b);
});
addEventListener('pointercancel',()=>{dr=null;$('drg')?.remove()});

function side(i,j){
  const l=G.lv,n=l.L.p.length,c=l.c;let m='';
  if(c[i].i<0||c[j].i<0) m='Точка '+sub(c[c[i].i<0?i:j].l)+' не принадлежит сечению (это ложная точка).';
  else{
    const ai=c[i].i,aj=c[j].i;
    if(!((ai-aj+n)%n==1||(aj-ai+n)%n==1)) m='Эти точки не соседние: сторона сечения должна лежать строго в одной грани фигуры.';
  }
  if(l.sides.some(s=>s.includes(i)&&s.includes(j))) return;
  if(m){l.msg=m; badSound(); if(mist())return; R(); return}
  
  l.sides.push([i,j]); l.nw=l.sides.length-1; l.msg=''; clickSound();
  if(l.sides.length==n){l.stage='q'; G.an=1; l.opts=shuf([l.L.n,...shuf(NAMES.filter(x=>x!=l.L.n)).slice(0,3)])}
  R()
}
function ans(j){const l=G.lv;if(l.stage!='q'||l.wr.includes(j))return;
 if(l.opts[j]==l.L.n){l.ans=j;l.stage='d';G.an=1;G.score+=10+5*l.st+5*l.L.d;goodSound();sparkle();conf()}else{l.wr.push(j);badSound();if(mist())return}R()}
function es(i){const l=G.lv;if(l.stage!='e')return;
 if(l.bad.includes(i)){l.stage='d';l.ok=i;G.an=1;G.score+=10+5*l.L.d;goodSound();sparkle();conf()}else{l.msg='Эта сторона построена верно. Ищи сторону, концы которой лежат в разных гранях.';badSound();if(mist())return}R()}
function useHint(){
 const l=G.lv;if(!l||l.stage!='b'||G.hints<=0||l.hint!==null)return;
 const n=l.L.p.length;
 const k=[...Array(n).keys()].find(i=>!l.sides.some(s=>s.includes(i)&&s.includes((i+1)%n)));
 if(k===undefined)return;
 l.hint=k;G.hints--;l.st=Math.max(0,l.st-1);R();
}
function nl(){G.clickPoint=null;G.idx++;if(G.idx>=G.list.length)fin();else load()}
function fin(){const k=G.m+(G.d||'');if(G.m!='learn'&&G.m!='tasks')best[k]=Math.max(best[k]||0,G.score);else conf();save();G.v='end';G.an=1;clearInterval(tmr);R()}

// БЛИЦ
function blitz(){G={v:'blitz',score:0,tm:60,streak:0,an:1};bq();clearInterval(tmr);tmr=setInterval(()=>{G.tm--;const e=$('tm');if(e)e.textContent=G.tm+' с';if(G.tm<=0){G.m='blitz';G.d='';fin()}},1000)}
function bq(){const L=rnd(LV);G.L=L;G.c=mk(L,0);G.opts=shuf([L.n,...shuf(NAMES.filter(x=>x!=L.n)).slice(0,3)]);G.bad=[];G.an=1;R()}
function ba(j){if(G.opts[j]==G.L.n){G.streak++;G.score+=10+G.streak;goodSound();if(G.streak%5==0){conf();sparkle()}bq()}else{G.tm=Math.max(0,G.tm-5);G.streak=0;G.bad.push(j);G.sk=1;badSound();R()}}

// НОВЫЙ РЕЖИМ ЗАДАЧ (ТЕСТЫ)
function startTasks(){
  G = {v:'tasks', m:'tasks', qList: shuf(TASKS_BANK).slice(0,5), idx: 0, score: 0, an: 1, wrong: []};
  R();
}
function answerTask(j) {
  if (G.wrong.includes(j)) return;
  const t = G.qList[G.idx];
  if (j === t.a) {
    G.score += 1; goodSound(); G.idx++;
    if (G.idx >= G.qList.length) fin(); else { G.wrong = []; G.an = 1; R(); }
  } else {
    G.wrong.push(j); badSound(); R();
  }
}

// === 4. ОТРИСОВКА SVG (ОСНОВНОЙ ВИД) ===
function draw(so,c,sides,fill,hl,mode,x){x=x||{};let g='';const S=SOL[so],hid=S.h.split(' ');
 S.e.split(' ').forEach(e=>{const[a,b]=e.split('-'),p=pr(S.v[a]),q=pr(S.v[b]);g+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="var(--ln)" stroke-width="2" stroke-linecap="round" ${hid.includes(e)?'stroke-dasharray="5 5" opacity=".7"':''}/>`});
 Object.keys(S.v).forEach(k=>{const[px,py]=pr(S.v[k]),r=S.v[k][0]>.4,u=S.v[k][2]>.5;g+=`<text x="${px+(r?9:-9)}" y="${py+(u?-8:15)}" font-size="13" fill="var(--mut)" text-anchor="${r?'start':'end'}">${sub(k)}</text>`});
 if(fill)g+=`<polygon class="${x.an?'fl':''}" points="${c.filter(q=>q.i>=0).map(q=>pr(q.pos).join(',')).join(' ')}" fill="var(--ac)" fill-opacity=".28" stroke="var(--ac)" stroke-width="${sides.length?0:3.5}" stroke-linejoin="round"/>`;
 sides.forEach(([a,b],k)=>{const p=pr(c[a].pos),q=pr(c[b].pos),bd=x.show&&x.bad.includes(k),cl=bd?'var(--bad)':'var(--ac)';
  g+=`<line class="${x.nw===k?'sd':''}" pathLength="1" x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${cl}" stroke-width="${bd?5:4}" stroke-linecap="round"/>`;
  if(mode=='err')g+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="transparent" stroke-width="26" onclick="es(${k})" style="cursor:pointer"/>`});
 if(mode)c.forEach((q,i)=>{const[px,py]=pr(q.pos),got=mode=='err'||sides.some(s=>s.includes(i)),v=typeof q.s=='string',h=hl.includes(i);
  if(got)g+=`<circle class="${x.nw>=0&&sides[x.nw]&&sides[x.nw].includes(i)?'pop':''}" cx="${px}" cy="${py}" r="7" fill="var(--ac)" stroke="var(--card)" stroke-width="2"/>`;
  else g+=`<circle class="ghost" cx="${px}" cy="${py}" r="${h?13:9}" fill="none" stroke="${h?'var(--ok)':'var(--ac)'}" stroke-width="3"/>`;
  if(!v)g+=`<text x="${px+11}" y="${py-9}" font-size="15" font-weight="700" fill="${got?'var(--ac)':'var(--mut)'}">${q.l}</text>`;
  
  if(mode=='drag'||mode=='click'){
    const sel=G.clickPoint===i;
    g+=`<circle data-point="${i}" cx="${px}" cy="${py}" r="${sel?40:34}" fill="${sel?'color-mix(in srgb, var(--ok) 18%, transparent)':'transparent'}" stroke="${sel?'var(--ok)':'transparent'}" stroke-width="${sel?3:8}" pointer-events="all" onpointerdown="pd(event,${i})" style="cursor:${mode=='click'?'pointer':'grab'};touch-action:none"/>`;
  }});
 return`<div id="sw" class="${G.sk?'shake':''}"><svg viewBox="0 0 400 340">${g}</svg></div>`}

// === 5. СВОБОДНАЯ 3D МАСТЕРСКАЯ ===
const FSH={cube:{n:'Куб',v:CUBE,e:CE},box:{n:'Параллелепипед',v:SOL.box.v,e:CE},pyr:{n:'Пирамида',v:SOL.pyr.v,e:SOL.pyr.e},pri:{n:'Треуг. призма',v:SOL.pri.v,e:SOL.pri.e},tet:{n:'Тетраэдр',v:SOL.tet.v,e:SOL.tet.e}};
function fRot(p){ let [x,y,z]=p,cy=Math.cos(F.ry),sy=Math.sin(F.ry),cx=Math.cos(F.rx),sx=Math.sin(F.rx); return [x*cy-z*sy, y*cx-(x*sy+z*cy)*sx, y*sx+(x*sy+z*cy)*cx];}
function fProj(p,W,H){const q=fRot(p),sc=Math.min(W,H)*.27*F.zoom;return[W/2+q[0]*sc,H/2-q[1]*sc-q[2]*sc*.15];}
function fCenter(){const v=Object.values(FSH[F.shape].v),c=v.reduce((a,p)=>a.map((x,i)=>x+p[i]),[0,0,0]).map(x=>x/v.length);return v.map(p=>p.map((x,i)=>x-c[i]));}
function fEdges(){return FSH[F.shape].e.split(' ').map(e=>e.split('-'));}
function freeDraw(){
 const c=$('freeCanvas');if(!c)return;const x=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight;c.width=w;c.height=h;x.clearRect(0,0,w,h);
 const ac=getComputedStyle(document.documentElement).getPropertyValue('--ac').trim(),ln=getComputedStyle(document.documentElement).getPropertyValue('--ln').trim();
 const v=fCenter(),keys=Object.keys(FSH[F.shape].v),vs={};keys.forEach((k,i)=>vs[k]=fProj(v[i],w,h));
 fEdges().forEach(e=>{x.beginPath();x.moveTo(...vs[e[0]]);x.lineTo(...vs[e[1]]);x.strokeStyle=ln;x.lineWidth=2;x.stroke()});
}
function freeSelect(k){F.shape=k; freeDraw(); R();}
function freePointer(e){F.drag={x:e.clientX,y:e.clientY,rx:F.rx,ry:F.ry};}
function freeMove(e){if(!F.drag)return; F.ry=F.drag.ry+(e.clientX-F.drag.x)*.01; F.rx=F.drag.rx+(e.clientY-F.drag.y)*.01; freeDraw();}
function freeUp(e){F.drag=null;}

   `<h2>База</h2><p>Планиметрия - плоские фигуры (квадраты, круги). Стереометрия - объемные (кубы, пирамиды). Помни, что <b>каждая грань</b> куба - это обычный квадрат из планиметрии.</p>`
   ];
   h=`<div class="card ${A} theory-section"><h2>📖 Теория: наглядно</h2></div><div class="theory-tabs">${tabs.map((t,i)=>`<button class="btn ${G.tab===i?'':'alt'}" onclick="G.tab=${i};G.an=1;R()">${t}</button>`).join('')}</div><div class="card theory-section">${sections[G.tab]}</div><div class="btn-group"><button class="btn alt" style="width: auto" onclick="learnHub()">← Назад</button></div>`;
 }

 // ВЫБОР СЛОЖНОСТИ КОНСТРУКТОРА
 else if(G.v=='diff'){
   h=`<div class="card ${A}"><h2>Уровень конструктора</h2><p>Чем выше, тем сложнее фигуры.</p></div>`+[['Лёгкий','Простые сечения'],['Средний','Диагонали, трапеции'],['Сложный','Сложные многоугольники']].map((x,i)=>`<button class="card" style="width: 100%; text-align: left; display: flex; align-items: center; justify-content: space-between; animation-delay:${i*70}ms; cursor: pointer" onclick="start('con',${i+1})"><div><b style="font-size: 18px">${x[0]}</b><br><span style="color:var(--mut); font-size: 14px">${x[1]}</span></div><b style="font-size: 24px; color: var(--ln)">›</b></button>`).join('');
 }

 // ИГРОВОЙ ПРОЦЕСС (СЕЧЕНИЯ)
 else if(G.v=='play'){
  const l=G.lv,L=l.L,n=L.p.length,err=G.m=='err',inf=`<div class="info"><span>Задание ${G.idx+1}/${G.list.length}</span><span>${G.m=='mar'||err?`<span class="hh">${'♥'.repeat(G.lives)}</span>`:'Счёт: '+G.score}</span></div><div class="bar"><i style="width:${G.idx/G.list.length*100}%"></i></div>`;
  if(err){
   const sd=l.sides[l.bad[0]];
   h=inf+draw(L.s,l.c,l.sides,1,[],'err',{bad:l.bad,show:l.stage=='d',an:G.an})+`<div class="card ${A}"><h2>Где ошибка?</h2>`+(l.stage=='e'?`<p>Нажми на линию, которая построена неверно (идет сквозь фигуру).</p>${l.msg?`<p class="msg">${l.msg}</p>`:''}`:`<p class="good">Верно!</p><p>Сторона сечения всегда должна лежать в одной грани.</p><button class="btn" onclick="nl()">Дальше</button>`)+'</div>';
  }else{
   const hl=[]; if(l.stage=='b'&&G.auto){hl.push([...Array(n).keys()].find(i=>!l.sides.some(s=>s.includes(i)&&s.includes((i+1)%n))));}
   h=inf+draw(L.s,l.c,l.sides,l.stage!='b',hl,l.stage=='b'?(settingsState.inputMode):null,{nw:l.nw,an:G.an})+`<div class="card ${A}">`;
   if(l.stage=='b') h+=`<h2>Построй сечение</h2><p>${settingsState.inputMode==='click'?'Нажимай на соседние точки по порядку':'Тяни линию между соседними точками'}.</p>${l.msg?`<p class="msg">${l.msg}</p>`:''}`;
   else{h+=`<h2>Что это за фигура?</h2><div class="opts">${l.opts.map((o,j)=>`<button class="${l.ans===j?'ok':l.wr.includes(j)?'bad':''}" onclick="ans(${j})">${o}</button>`).join('')}</div>`;
    if(l.stage=='d')h+=`<p class="good">Правильно! ${L.n}.</p><button class="btn success-flash" onclick="nl()">Дальше</button>`}
   h+='</div>';
  }
 }

 // ЗАДАЧИ (ТЕСТЫ)
 else if(G.v=='tasks') {
   const q = G.qList[G.idx];
   h=`<div class="info"><span>Вопрос ${G.idx+1}/${G.qList.length}</span><span>Верно: ${G.score}</span></div><div class="bar"><i style="width:${G.idx/G.qList.length*100}%"></i></div>
   <div class="card ${A}" style="margin-top: 20px">
     <h2 style="font-size: 22px; margin-bottom: 20px;">${q.q}</h2>
     <div class="free-wrap">
       ${q.o.map((opt, j) => `<button class="btn alt ${G.wrong.includes(j)?'bad':''}" style="text-align:left; max-width:100%; border-color: ${G.wrong.includes(j)?'var(--bad)':'var(--ln)'}; color:${G.wrong.includes(j)?'var(--bad)':'var(--tx)'}" onclick="answerTask(${j})">${opt}</button>`).join('')}
     </div>
   </div>`;
 }

 // БЛИЦ
 else if(G.v=='blitz'){
  h=`<div class="info"><span>Счёт: ${G.score}${G.streak>1?' (серия ×'+G.streak+')':''}</span><span id="tm" style="color:var(--bad)">${G.tm} с</span></div><div class="bar"><i style="width:${G.tm/60*100}%"></i></div>`+draw(G.L.s,G.c,[],1,[],null,{an:G.an})+`<div class="card"><h2>Что за фигура?</h2><div class="opts">${G.opts.map((o,j)=>`<button class="${G.bad.includes(j)?'bad':''}" onclick="ba(${j})">${o}</button>`).join('')}</div></div>`;
 }

 // ФИНАЛЬНЫЙ ЭКРАН
 else if(G.v=='end'){
  const tsk = G.m=='tasks';
  h=`<div class="card a" style="text-align: center; padding: 40px 20px"><div style="font-size: 48px; margin-bottom: 10px">${tsk?'📝':'🏆'}</div><h2>${tsk?'Тест завершен':'Игра окончена'}</h2>
  <p style="font-size:24px;color:var(--ac)"><b>${G.score}</b> ${tsk?'из 5 верных':'очков'}</p>
  <div style="display:flex;gap:8px;justify-content:center; flex-wrap: wrap; margin-top: 20px"><button class="btn" onclick="${tsk?'startTasks()':'menu()'}">${tsk?'Решить другие':'В меню'}</button></div></div>`;
 }
 
 m.innerHTML=h; G.an=0; G.sk=0; if(G.lv)G.lv.nw=-1;
}

// === 7. ЗАПУСК ===
// Убираем экран загрузки после 1.5 секунд (или по событию load)
window.addEventListener('load', () => {
  setTimeout(() => {
    const lw = document.getElementById('loader-wrap');
    lw.style.opacity = '0';
    document.getElementById('app').style.display = 'block';
    setTimeout(() => lw.remove(), 500); // Полностью удаляем из DOM
  }, 1200); // Время симуляции загрузки
});

menu();
</script>
</body>
</html>
