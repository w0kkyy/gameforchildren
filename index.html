<script>
/* ============================================================
   РАЗДЕЛЫ КОДА (для быстрого поиска):
   1. ДАННЫЕ — SOL, LV, NAMES (фигуры и уровни)
   2. УТИЛИТЫ — $, rnd, co, pr, share...
   3. СОСТОЯНИЕ — G, best, settingsState, F
   4. ЗВУК И ЭФФЕКТЫ — tone, goodSound, conf, theme
   5. МЕНЮ И НАВИГАЦИЯ — menu, settings, theory
   6. ИГРОВАЯ ЛОГИКА — mk, start, load, side, trySide, ans
   7. РЕЖИМ ЗАДАЧ — startTasks
   8. БЛИЦ — blitz, bq, ba
   9. ОТРИСОВКА SVG — draw
   10. СВОБОДНАЯ 3D — FSH, freeDraw, freePointer...
   11. РЕНДЕР ИНТЕРФЕЙСА — R()

    const o=audioCtx.createOscillator(),g=audioCtx.createGain();

}

   `<h2>Сечения многогранников</h2><p>Сечение — многоугольник, полученный пересечением многогранника плоскостью.</p><h3>Алгоритм</h3><div class="step"><i>1</i><p>Найди известные точки сечения.</p></div><div class="step"><i>2</i><p>На каждой пересечённой грани ищи вторую точку.</p></div><div class="step"><i>3</i><p>Соединяй две точки только внутри одной грани.</p></div><div class="step"><i>4</i><p>Продолжай по соседним граням, пока многоугольник не замкнётся.</p></div><div class="theory-example"><b>Важное правило:</b> если плоскость пересекает две параллельные грани, линии сечения в этих гранях параллельны.</div>`,
   `<h2>Разобранные примеры</h2>
<div class="theory-example" style="border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card))"><b style="color:var(--ok)">✓ Куб + плоскость параллельна грани.</b><br>Сечение имеет ту же форму, что и грань: квадрат или прямоугольник.</div>
<div class="theory-example" style="border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card))"><b style="color:var(--ok)">✓ Куб + плоскость через три ребра из одной вершины.</b><br>Пересекаются три грани → получается треугольник.</div>
<div class="theory-example" style="border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card))"><b style="color:var(--ok)">✓ Куб + плоскость пересекает шесть граней.</b><br>Сечение может быть шестиугольником. Число сторон ≤ числа пересечённых граней.</div>
<div style="margin:14px 0;padding:12px;border-radius:16px;background:var(--bg);border:1px solid var(--ln);text-align:center">
<svg viewBox="0 0 300 120" width="280">
<polygon points="30,90 70,25 110,90" fill="color-mix(in srgb,var(--ac) 20%,transparent)" stroke="var(--ac)" stroke-width="2"/><text x="45" y="110" font-size="11" fill="var(--mut)">треугольник</text>
<rect x="140" y="30" width="55" height="55" fill="color-mix(in srgb,var(--ok) 20%,transparent)" stroke="var(--ok)" stroke-width="2"/><text x="140" y="105" font-size="11" fill="var(--mut)">квадрат</text>
<polygon points="240,35 270,35 285,58 270,82 240,82 225,58" fill="color-mix(in srgb,var(--ac) 20%,transparent)" stroke="var(--ac)" stroke-width="2"/><text x="230" y="105" font-size="11" fill="var(--mut)">шестиугольник</text>
</svg>
<div style="font-size:13px;color:var(--mut);margin-top:8px">Возможные формы сечений куба</div></div>`,
   `<h2>Типичные ошибки (с картинками)</h2>
<div class="theory-example" style="border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card))"><b style="color:var(--bad)">✗ Соединять точки из разных граней.</b><br>Сторона сечения всегда лежит <b>внутри одной грани</b>. Если точки на разных гранях — соединять нельзя.</div>
<div style="margin:14px 0;padding:12px;border-radius:16px;background:var(--bg);border:1px solid var(--ln);text-align:center">
<svg viewBox="0 0 280 150" width="260"><path d="M50,40 L150,40 L180,20 L80,20 Z" fill="none" stroke="var(--ln)" stroke-width="1.5"/><path d="M50,40 L50,120 L150,120 L150,40" fill="none" stroke="var(--ln)" stroke-width="1.5"/><path d="M150,40 L180,20 L180,100 L150,120" fill="none" stroke="var(--ln)" stroke-width="1.5"/><circle cx="70" cy="60" r="5" fill="var(--ok)"/><circle cx="160" cy="90" r="5" fill="var(--bad)"/><line x1="70" y1="60" x2="160" y2="90" stroke="var(--bad)" stroke-width="2.5" stroke-dasharray="6 4"/><text x="55" y="55" font-size="12" fill="var(--ok)">M</text><text x="165" y="85" font-size="12" fill="var(--bad)">N</text><text x="70" y="140" font-size="12" fill="var(--bad)">нельзя: разные грани</text></svg>
<div style="font-size:13px;color:var(--mut);margin-top:8px">Ошибка: точки M и N лежат в разных гранях</div></div>
<div class="theory-example" style="border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card))"><b style="color:var(--bad)">✗ Забывать скрытые рёбра.</b><br>На рисунке часть рёбер «спрятана» за фигурой (пунктир). Точки на них тоже нужно учитывать.</div>
<div class="theory-example" style="border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card))"><b style="color:var(--bad)">✗ Не проверять параллельность.</b><br>Если грани параллельны, линии сечения на них тоже параллельны.</div>
<div class="theory-example" style="border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card))"><b style="color:var(--ok)">✓ Как проверить себя:</b> пройди по каждой стороне сечения и назови грань, в которой она лежит. Если для какой-то стороны грани нет — построение неверно.</div>`
   ];
   h=`<div class="card ${A} theory-section"><h2>📖 Теория по геометрии</h2><p>Справочник для 10 класса: от планиметрии и аксиом до сечений.</p></div><div class="theory-tabs">${tabs.map((t,i)=>`<button class="btn ${G.tab===i?'':'alt'}" onclick="G.tab=${i};G.an=1;R()">${t}</button>`).join('')}</div><div class="card theory-section">${sections[G.tab]}</div><div class="theory-tabs"><button class="btn alt" onclick="learnHub()">← Обучение</button><button class="btn" onclick="start('learn')">🎯 Практика</button></div>`;
 }
 else if(G.v=='diff')h=`<div class="card ${A}"><h2>Выбор сложности</h2><p>Чем выше сложность, тем больше лишних точек и необычнее сечения.</p></div><div style="height:10px"></div>`+[['Лёгкий','Простые сечения, мало лишних точек'],['Средний','Диагонали, параллелограммы, трапеции'],['Сложный','Пятиугольники и шестиугольники']].map((x,i)=>`<button class="tile" style="animation-delay:${i*70+80}ms" onclick="start('con',${i+1})"><div class="ic">${i+1}</div><div class="tx"><b>${x[0]}</b><span>${x[1]}${best['con'+(i+1)]?' · рекорд '+best['con'+(i+1)]:''}</span></div><i class="ch">›</i></button>`).join('');
 else if(G.v=='play'){const l=G.lv,L=l.L,n=L.p.length,err=G.m=='err',inf=`<div class="info"><span>${SOL[L.s].n} · ${G.idx+1}/${G.list.length}</span><span>${G.m=='mar'||err||G.m=='tasks'?`<span class="hh">${'♥'.repeat(G.lives)}</span>`:'★'.repeat(l.st)+'☆'.repeat(3-l.st)} · ${G.score}</span></div><div class="bar"><i style="width:${G.idx/G.list.length*100}%"></i></div>`;
  if(err){const sd=l.sides[l.bad[0]],ex=`Точки ${sub(l.c[sd[0]].l)} и ${sub(l.c[sd[1]].l)} лежат в разных гранях, поэтому соединить их стороной сечения нельзя.`;
   h=inf+draw(L.s,l.c,l.sides,1,[],'err',{bad:l.bad,show:l.stage=='d',an:G.an})+`<div class="card ${A}"><h2>Найди ошибку</h2>`+(l.stage=='e'?`<p>В построении одна сторона неверная. Нажми на неё.</p>${l.msg?`<p class="msg">${l.msg}</p>`:''}`:`<p class="good">Верно!</p><p>${ex} Сторона сечения всегда лежит в одной грани.</p><button class="btn" onclick="nl()">Дальше</button>`)+'</div>'}
  else{const hl=[];if(l.stage=='b'){
 const k=[...Array(n).keys()].find(i=>!l.sides.some(s=>s.includes(i)&&s.includes((i+1)%n)));
 if(G.auto)hl.push(k);
 else if(l.hint!==null)hl.push(l.hint);
}
   h=inf+draw(L.s,l.c,l.sides,l.stage!='b',hl,l.stage=='b'?(settingsState.inputMode):null,{nw:l.nw,an:G.an})+`<div class="card ${A}">`;
   if(l.stage=='b')h+=`<h2>Построй сечение</h2><p>${settingsState.inputMode==='click'?'Нажми на первую точку, затем на вторую.':'Тяни линию от одной точки к другой.'} Выбирай соседние точки сечения. Построено сторон: ${l.sides.length} из ${n}.</p>${l.msg?`<p class="msg">${l.msg}</p>`:''}${G.auto?'<p>Зелёное кольцо показывает одну точку следующей стороны.</p>':G.hints>0&&l.hint===null?`<button class="btn alt" onclick="useHint()">Подсказка · осталось ${G.hints}</button>`:`<p>Подсказок осталось: ${G.hints}</p>`}`;
   else{h+=`<h2>Какая это фигура?</h2><div class="opts">${l.opts.map((o,j)=>`<button class="${l.ans===j?'ok':l.wr.includes(j)?'bad':''}" onclick="ans(${j})">${o}</button>`).join('')}</div>`;
    if(l.stage=='d')h+=`<p class="good">Верно! ${L.n}.</p><p>${L.t}</p><p class="good">+${10+5*l.st+5*l.L.d} очков</p><button class="btn success-flash" onclick="nl()">Дальше</button>`}
   h+='</div>'}}
 else if(G.v=='blitz')h=`<div class="info"><span>Счёт: ${G.score}${G.streak>1?' · серия ×'+G.streak:''}</span><span id="tm">${G.tm} с</span></div><div class="bar"><i style="width:${G.tm/60*100}%"></i></div>`+draw(G.L.s,G.c,[],1,[],null,{an:G.an})+`<div class="card"><h2>Какая фигура в сечении?</h2><div class="opts">${G.opts.map((o,j)=>`<button class="${G.bad.includes(j)?'bad':''}" onclick="ba(${j})">${o}</button>`).join('')}</div><p>Ошибка отнимает 5 секунд.</p></div>`;
 else if(G.v=='end'){
 if(G.m==='tasks'){
  const correct=G.correct||0;
  const grade=correct>=5?5:correct===4?4:correct===3?3:correct===2?2:1;
  const words={5:'Отлично!',4:'Хорошо!',3:'Удовлетворительно',2:'Нужно повторить',1:'Стоит ещё потренироваться'};
  h=`<div class="card a" style="text-align:center;padding:24px"><div style="font-size:64px;font-weight:800;color:var(--ac);line-height:1">${grade}</div><p style="font-size:18px;margin-top:8px">${words[grade]}</p><p>Верно: <b>${correct}</b> из 5 · Очки: ${G.score}</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px"><button class="btn" onclick="startTasks()">Ещё раз</button><button class="btn alt" onclick="menu()">Меню</button></div></div>`;
 }else{
  const w=G.m=='learn',r=G.m=='blitz'?'blitz()':w?'menu()':`start('${G.m}',${G.d||0})`;
  h=`<div class="card a"><div class="big">${w?'Обучение пройдено':'Игра окончена'}</div><p style="text-align:center;font-size:24px;color:var(--tx)"><b>${G.score}</b> очков</p><p style="text-align:center">${w?'Теперь попробуй Конструктор.':'Рекорд: '+(best[G.m+(G.d||'')]||0)}</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="${r}">${w?'В меню':'Ещё раз'}</button><button class="btn alt" onclick="menu()">Меню</button></div></div>`;
 }
}
 m.innerHTML=h;G.an=0;G.sk=0;if(G.lv)G.lv.nw=-1}
window.addEventListener('load',()=>{setTimeout(()=>{const ov=document.getElementById('loader-overlay');if(ov)ov.classList.add('hide')},1800)});
if(document.readyState==='complete'){setTimeout(()=>{const ov=document.getElementById('loader-overlay');if(ov)ov.classList.add('hide')},1800)}
menu();
</script></body></html>
