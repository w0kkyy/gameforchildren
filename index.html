let audioCtx=null,soundOn=true;
function tone(freq,dur,type='sine',gain=.055){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

   h=`<div class="card ${A}"><h2>Свободная 3D-мастерская</h2><p>Выбери многогранник, крути его мышью и сам создавай плоскость сечения.</p></div>
   <div class="free-wrap"><div class="free-toolbar">${shapes.map(([k,v])=>`<button class="free-shape ${F.shape==k?'active':''}" onclick="freeSelect('${k}')">${v.n}</button>`).join('')}
   <button onclick="freeReset()">↻ Сбросить</button></div>
   <canvas id="freeCanvas" height="390" onpointerdown="freePointer(event)" onpointermove="freeMove(event)" onpointerup="freeUp(event)" onpointercancel="freeUp(event)" onwheel="freeWheel(event)"></canvas>
   <div class="card"><b>Как управлять</b><p class="free-help">Перетаскивай мышью по пустому месту, чтобы вращать фигуру. Зажми Shift и проведи линию мышью по фигуре, чтобы задать плоскость сечения. Колесо мыши меняет масштаб.</p>
   ${F.show?`<p class="good">Сечение найдено: ${F.pts.length} точек.</p><p>Поверни фигуру и попробуй провести другую плоскость.</p>`:`<p>Проведи линию с Shift — получишь сечение многогранника.</p>`}</div></div>`;
   setTimeout(freeDraw,0);
 }
 else if(G.v=='theory'){
   const tabs=['Основы','Алгоритм','Примеры','Ошибки'];
   const sections=[
   `<h2>Что такое сечение?</h2><p>Сечение многогранника — это фигура, которая получается при пересечении многогранника плоскостью.</p><div class="theory-example"><b>Главная идея:</b> плоскость пересекает грани многогранника, а границы получившейся фигуры лежат внутри этих граней.</div><p>Поэтому вершины сечения обычно находятся на рёбрах многогранника, а его стороны лежат в гранях.</p>`,
   `<h2>Как строить сечение</h2><div class="step"><i>1</i><p>Найди точки, через которые проходит плоскость.</p></div><div class="step"><i>2</i><p>Определи, на каких рёбрах или вершинах лежат точки сечения.</p></div><div class="step"><i>3</i><p>Соединяй соседние точки только тогда, когда отрезок лежит в одной грани.</p></div><div class="step"><i>4</i><p>Проверь все пересечённые грани и замкни получившийся многоугольник.</p></div><div class="theory-example"><b>Правило:</b> если две точки лежат в одной грани, их можно соединить стороной сечения.</div>`,
   `<h2>Пример</h2><p>Плоскость проходит через три точки на рёбрах куба, расположенных так, что пересекаются три грани.</p><div class="theory-example"><b>Получаем треугольник.</b><br>Три пересечённые грани дают три стороны сечения.</div><p>Если плоскость параллельна грани куба, сечение будет равно этой грани — например, квадратом.</p><div class="theory-example"><b>Ещё пример:</b> плоскость, пересекающая шесть граней куба, может дать шестиугольник.</div>`,
   `<h2>Типичные ошибки</h2><p>Не соединяй любые две ближайшие точки. Сначала проверь, лежат ли они в одной грани.</p><p>Не забывай про скрытые рёбра и точки сечения на задней части фигуры.</p><p>После построения посчитай стороны и сравни форму с условиями задачи.</p><div class="theory-example"><b>Совет:</b> двигайся по граням последовательно — так легче не пропустить точку.</div>`
   ];
   h=`<div class="card ${A} theory-section"><h2>📖 Теория: сечения многогранников</h2><p>Мини-справочник перед практикой.</p></div><div class="theory-tabs">${tabs.map((t,i)=>`<button class="btn ${G.tab===i?'':'alt'}" onclick="G.tab=${i};G.an=1;R()">${t}</button>`).join('')}</div><div class="card theory-section">${sections[G.tab]}</div>`;
 }
 else if(G.v=='diff')h=`<div class="card ${A}"><h2>Выбор сложности</h2><p>Чем выше сложность, тем больше лишних точек и необычнее сечения.</p></div><div style="height:10px"></div>`+[['Лёгкий','Простые сечения, мало лишних точек'],['Средний','Диагонали, параллелограммы, трапеции'],['Сложный','Пятиугольники и шестиугольники']].map((x,i)=>`<button class="tile" style="animation-delay:${i*70+80}ms" onclick="start('con',${i+1})"><div class="ic">${i+1}</div><div class="tx"><b>${x[0]}</b><span>${x[1]}${best['con'+(i+1)]?' · рекорд '+best['con'+(i+1)]:''}</span></div><i class="ch">›</i></button>`).join('');
 else if(G.v=='play'){const l=G.lv,L=l.L,n=L.p.length,err=G.m=='err',inf=`<div class="info"><span>${SOL[L.s].n} · ${G.idx+1}/${G.list.length}</span><span>${G.m=='mar'||err?`<span class="hh">${'♥'.repeat(G.lives)}</span>`:'★'.repeat(l.st)+'☆'.repeat(3-l.st)} · ${G.score}</span></div><div class="bar"><i style="width:${G.idx/G.list.length*100}%"></i></div>`;
  if(err){const sd=l.sides[l.bad[0]],ex=`Точки ${sub(l.c[sd[0]].l)} и ${sub(l.c[sd[1]].l)} лежат в разных гранях, поэтому соединить их стороной сечения нельзя.`;
   h=inf+draw(L.s,l.c,l.sides,1,[],'err',{bad:l.bad,show:l.stage=='d',an:G.an})+`<div class="card ${A}"><h2>Найди ошибку</h2>`+(l.stage=='e'?`<p>В построении одна сторона неверная. Нажми на неё.</p>${l.msg?`<p class="msg">${l.msg}</p>`:''}`:`<p class="good">Верно!</p><p>${ex} Сторона сечения всегда лежит в одной грани.</p><button class="btn" onclick="nl()">Дальше</button>`)+'</div>'}
  else{const hl=[];if(l.stage=='b'){
 const k=[...Array(n).keys()].find(i=>!l.sides.some(s=>s.includes(i)&&s.includes((i+1)%n)));
 if(G.auto)hl.push(k);
 else if(l.hint!==null)hl.push(l.hint);
}
   h=inf+draw(L.s,l.c,l.sides,l.stage!='b',hl,l.stage=='b'?'drag':null,{nw:l.nw,an:G.an})+`<div class="card ${A}">`;
   if(l.stage=='b')h+=`<h2>Построй сечение</h2><p>Тяни линию от одной точки к другой. Выбирай соседние точки сечения. Построено сторон: ${l.sides.length} из ${n}.</p>${l.msg?`<p class="msg">${l.msg}</p>`:''}${G.auto?'<p>Зелёное кольцо показывает одну точку следующей стороны.</p>':G.hints>0&&l.hint===null?`<button class="btn alt" onclick="useHint()">Подсказка · осталось ${G.hints}</button>`:`<p>Подсказок осталось: ${G.hints}</p>`}`;
   else{h+=`<h2>Какая это фигура?</h2><div class="opts">${l.opts.map((o,j)=>`<button class="${l.ans===j?'ok':l.wr.includes(j)?'bad':''}" onclick="ans(${j})">${o}</button>`).join('')}</div>`;
    if(l.stage=='d')h+=`<p class="good">Верно! ${L.n}.</p><p>${L.t}</p><p class="good">+${10+5*l.st+5*l.L.d} очков</p><button class="btn success-flash" onclick="nl()">Дальше</button>`}
   h+='</div>'}}
 else if(G.v=='blitz')h=`<div class="info"><span>Счёт: ${G.score}${G.streak>1?' · серия ×'+G.streak:''}</span><span id="tm">${G.tm} с</span></div><div class="bar"><i style="width:${G.tm/60*100}%"></i></div>`+draw(G.L.s,G.c,[],1,[],null,{an:G.an})+`<div class="card"><h2>Какая фигура в сечении?</h2><div class="opts">${G.opts.map((o,j)=>`<button class="${G.bad.includes(j)?'bad':''}" onclick="ba(${j})">${o}</button>`).join('')}</div><p>Ошибка отнимает 5 секунд.</p></div>`;
 else if(G.v=='end'){const w=G.m=='learn',r=G.m=='blitz'?'blitz()':w?'menu()':`start('${G.m}',${G.d||0})`;h=`<div class="card a"><div class="big">${w?'Обучение пройдено':'Игра окончена'}</div><p style="text-align:center;font-size:24px;color:var(--tx)"><b>${G.score}</b> очков</p><p style="text-align:center">${w?'Теперь попробуй Конструктор.':'Рекорд: '+(best[G.m+(G.d||'')]||0)}</p><div style="display:flex;gap:8px;justify-content:center"><button class="btn" onclick="${r}">${w?'В меню':'Ещё раз'}</button><button class="btn alt" onclick="menu()">Меню</button></div></div>`}
 m.innerHTML=h;G.an=0;G.sk=0;if(G.lv)G.lv.nw=-1}
menu();
